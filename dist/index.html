  <body>
    <div id="root"></div>
    <script>
      // Restore path from 404.html redirect
      (function () {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('path');
        if (path) {
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(null, '', base + path);
        }
      })();
    </script>
  </body>
